<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17130f" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ebe7e0" />
		<script>
			// Apply a saved theme before first paint to avoid a flash; otherwise CSS follows the system.
			try {
				var theme = localStorage.getItem('theme');
				if (theme === 'light' || theme === 'dark') {
					document.documentElement.dataset.theme = theme;
					document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
						meta.content = theme === 'light' ? '#ebe7e0' : '#17130f';
					});
				}
			} catch (e) {}
		</script>
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
